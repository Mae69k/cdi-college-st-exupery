services:
  db:
    image: postgres:16-alpine
    container_name: cdi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cdi
    ports:
      - "5432:5432"
    volumes:
      - cdi-pgdata:/var/lib/postgresql/data

volumes:
  cdi-pgdata:
